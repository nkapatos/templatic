# Framework toolchain and checks. Each example under examples/ is its own
# module with its own tasks; `mise run examples` builds and checks them all. Dev tools are pinned here, not in go.mod, so
# they stay out of the module graph of apps that depend on templatic
# (staticcheck, exhaustive and templ stay in go.mod's tool block).
[tools]
go = "1.27.4"
node = "26.13.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.10.0"
actionlint = "1.7.12"

[tasks.build]
description = "Build the templatic CLI into bin/"
dir = "{{config_root}}"
run = "go build -o bin/templatic ./cmd/templatic"

[tasks.fmt]
description = "gofmt -l (fails on unformatted files)"
dir = "{{config_root}}"
run = """#!/usr/bin/env bash
set -euo pipefail
bad=$(gofmt -l .)
if [ -n "$bad" ]; then echo "fmt: unformatted files:" >&2; echo "$bad" >&2; exit 1; fi
"""

[tasks.fmt-fix]
description = "gofmt -w (rewrite unformatted files)"
dir = "{{config_root}}"
run = "gofmt -w ."

[tasks.tidy]
description = "go mod tidy -diff (fails when go.mod or go.sum is not tidy)"
dir = "{{config_root}}"
run = "go mod tidy -diff"

[tasks.vet]
description = "go vet ./..."
dir = "{{config_root}}"
run = "go vet ./..."

[tasks.lint]
description = "staticcheck and exhaustive (pinned via go.mod tool directive)"
dir = "{{config_root}}"
run = """#!/usr/bin/env bash
set -euo pipefail
go tool staticcheck ./...
go tool exhaustive -typeignore '^reflect\\.Kind$' ./...
"""

[tasks.test]
depends = ["npm-install"]
description = "go test -race -shuffle=on ./... (requires CGO)"
dir = "{{config_root}}"
run = "CGO_ENABLED=1 go test -race -shuffle=on ./..."

[tasks.vuln]
description = "govulncheck: known vulnerabilities in code templatic calls (needs network)"
dir = "{{config_root}}"
run = "govulncheck ./..."

[tasks.lint-actions]
description = "actionlint over .github/workflows"
dir = "{{config_root}}"
run = "actionlint"

[tasks.npm-install]
description = "npm ci for the TS runtime (exactly package-lock.json), once, before the tasks that need node_modules"
dir = "{{config_root}}/internal/clientruntime"
run = "[ -d node_modules ] || npm ci --silent"

[tasks.typecheck]
depends = ["npm-install"]
description = "tsc --noEmit for the TS runtime and its tests"
dir = "{{config_root}}/internal/clientruntime"
run = """#!/usr/bin/env bash
set -euo pipefail
npm run typecheck
"""

[tasks.test-ts]
depends = ["npm-install"]
description = "vitest + happy-dom for the TS runtime"
dir = "{{config_root}}/internal/clientruntime"
run = """#!/usr/bin/env bash
set -euo pipefail
npm test --silent
"""

[tasks.api]
depends = ["npm-install"]
description = "API Extractor: the public SDK surface must match internal/clientruntime/etc/*.api.md"
dir = "{{config_root}}/internal/clientruntime"
run = """#!/usr/bin/env bash
set -euo pipefail
npm run --silent api
"""

[tasks.examples]
description = "Every example: npm ci, generate, tidy, vet, test, check-ts; fail if a committed generated file is stale"
dir = "{{config_root}}"
run = """#!/usr/bin/env bash
set -euo pipefail
shopt -s nullglob
# Every example requires one templatic version: the latest v* tag, or the
# untagged version a release PR is about to tag (v0.0.0 before any tag).
latest=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
want=""
for d in examples/*/; do
  [ -f "$d/go.mod" ] || continue
  v=$(cd "$d" && go list -m github.com/nkapatos/templatic | awk '{print $2}')
  if [ -z "$want" ]; then want=$v; fi
  if [ "$v" != "$want" ]; then echo "examples: $d requires templatic $v, others $want (mise run examples-version)" >&2; exit 1; fi
done
if [ -n "$want" ] && [ "$want" != "$latest" ] && git rev-parse -q --verify "refs/tags/$want" >/dev/null; then
  echo "examples: they require templatic $want, but $latest is the latest tag (mise run examples-version $latest)" >&2; exit 1
fi
for d in examples/*/; do
  [ -f "$d/go.mod" ] || continue
  echo "examples: $d"
  (
    cd "$d"
    npm ci --no-audit --no-fund --loglevel=error
    # An example with its own build steps (e.g. Tailwind) runs them in its generate script.
    if grep -q '"generate":' package.json; then npm run --silent generate >/dev/null; else go tool templatic generate >/dev/null; fi
    go mod tidy -diff
    go vet ./...
    go test ./...
    go tool templatic check-ts
  )
done
status=$(git status --porcelain --untracked-files=normal -- examples)
if [ -n "$status" ]; then echo "examples: generated files differ from the committed ones (run go tool templatic generate in each):" >&2; echo "$status" >&2; git diff --stat -- examples >&2; exit 1; fi
"""

[tasks.examples-version]
description = "Set every example's templatic require to a version (the release PR, before tagging)"
dir = "{{config_root}}"
usage = 'arg "<version>" help="vMAJOR.MINOR.PATCH"'
run = """#!/usr/bin/env bash
set -euo pipefail
v="${usage_version:?}"
echo "$v" | grep -Eq '^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$' || { echo "examples-version: $v is not vMAJOR.MINOR.PATCH" >&2; exit 1; }
for d in examples/*/; do
  [ -f "$d/go.mod" ] || continue
  (cd "$d" && go mod edit -require="github.com/nkapatos/templatic@$v")
done
"""

[tasks.check]
description = "All checks, then assert the tree is clean"
dir = "{{config_root}}"
depends = ["build", "fmt", "tidy", "vet", "lint", "lint-actions", "vuln", "test", "typecheck", "test-ts", "api"]
run = """#!/usr/bin/env bash
set -euo pipefail
status=$(git status --porcelain --untracked-files=normal)
if [ -n "$status" ]; then echo "check: tree not clean:" >&2; echo "$status" >&2; exit 1; fi
"""
