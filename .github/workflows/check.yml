name: check

# mise installs the pinned go, node and tools (mise.toml [tools]); `mise run
# check` runs every check exactly as it does locally (mise.toml [tasks.check]).
# The weekly run catches newly published vulnerabilities (govulncheck) when
# nothing was pushed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: mise install (pinned toolchain and tools)
        run: mise install
      - name: mise run check
        run: mise run check

  # Each example is its own module, outside the root go test ./...; this
  # builds every one against this checkout.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags: examples must require the latest release
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: mise install (pinned toolchain and tools)
        run: mise install
      - name: mise run examples
        run: mise run examples
