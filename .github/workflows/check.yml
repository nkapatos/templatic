name: check

# mise installs the pinned go and node (mise.toml [tools]); `mise run check`
# runs every check exactly as it does locally (mise.toml [tasks.check]).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: mise install (pinned go + node)
        run: mise install
      - name: mise run check
        run: mise run check
