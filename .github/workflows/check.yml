name: check

# The clean-tree invariant, enforced per push and pull request.
# mise installs the pinned toolchain (go, node — see mise.toml tools);
# `mise run check` then covers fmt, vet, lint, race-detector
# tests, typecheck and the clean-tree assertion exactly as it
# does locally (mise.toml tasks.check).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: mise install (pinned go + node)
        run: mise install
      - name: mise run check
        run: mise run check
