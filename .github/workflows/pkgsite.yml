name: pkgsite

# On a release tag, ask the Go module proxy for the new version so that
# pkg.go.dev indexes it without waiting for the first user to fetch it.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: request the version from proxy.golang.org
        run: curl -fsS "https://proxy.golang.org/github.com/nkapatos/templatic/@v/${GITHUB_REF_NAME}.info"
